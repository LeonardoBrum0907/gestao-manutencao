<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Manutenção</title>
    <!-- App instalável (PWA): manifesto, ícones e cor da barra do celular. O service worker é registrado em src/main.tsx. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#287a51" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Gestão" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var key = "gestao-manutencao-theme";
        var theme = "light";
        try {
          var stored = localStorage.getItem(key);
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (error) {}
        if (theme === "light") {
          var match = document.cookie.match(/(?:^|; )theme=(light|dark)/);
          if (!localStorage.getItem(key) && match) theme = match[1];
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
