<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caderno do Gestor</title>
    <!-- App instalável (PWA): manifesto, ícones e cor da barra do celular. O service worker é registrado em src/main.tsx. -->
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#084c89" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta id="app-title" name="apple-mobile-web-app-title" content="Caderno" />
    <script>
      // Página pública de RPs: instala um app à parte, que abre no próprio link e não no login do coordenador.
      // O manifesto do app inteiro abre em "/", que sem login vai para /login (thread "PWA abrindo login no link público").
      // A API monta o manifesto com o código no start_url: no iPhone o app instalado não vê o que o Safari guardou.
      var publicLink = location.pathname.match(/^\/rp\/abrir\/([A-Za-z0-9_-]{24})(?:\/|$)/);
      if (publicLink) {
        document.getElementById("app-manifest").setAttribute("href", "/api/public/rp/" + publicLink[1] + "/manifest");
        document.getElementById("app-title").setAttribute("content", "RPs");
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,600&family=Source+Code+Pro:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var key = "gestao-manutencao-theme";
        var theme = "light";
        try {
          var stored = localStorage.getItem(key);
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (error) {}
        if (theme === "light") {
          var match = document.cookie.match(/(?:^|; )theme=(light|dark)/);
          if (!localStorage.getItem(key) && match) theme = match[1];
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
