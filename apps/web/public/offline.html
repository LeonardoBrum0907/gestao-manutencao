<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#287a51" />
    <title>Sem conexão · Gestão de Manutenção</title>
    <!-- Página guardada pelo sw.js para quando o celular está sem internet: tudo embutido, sem arquivo externo.
         Cores iguais às de apps/web/src/design/tokens.css. -->
    <style>
      :root { color-scheme: light; --bg: #f5f8f6; --surface: #ffffff; --text: #1c2822; --muted: #5e6e64; --border: #e0e9e3; --accent: #287a51; --accent-contrast: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; --bg: #121815; --surface: #1b2420; --text: #e7f0ea; --muted: #a3b5aa; --border: #2d3b34; --accent: #3dbe7a; --accent-contrast: #062113; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
      main { max-width: 22rem; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
      h1 { margin: 0; font-size: 1.25rem; }
      p { margin: 0; color: var(--muted); line-height: 1.5; }
      button { align-self: flex-start; border: 0; border-radius: 6px; padding: 10px 16px; font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-contrast); cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>O celular está sem internet. Assim que a conexão voltar, toque em Tentar de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
