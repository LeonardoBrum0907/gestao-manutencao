# Ambiente de teste na VPS: cópia da produção com banco, anexos e segredos próprios.
# Roda de um clone separado (/home/leo/caderno-teste), no ramo que se quiser testar,
# e o Caddy da produção entrega https://TESTE_DOMAIN para o web daqui pela rede caderno-borda.
# O web (nginx) serve a tela e repassa /api e /health para a API de teste: mesmo domínio,
# então o login por cookie funciona sem CORS e sem mexer no vercel.json.
#
# Quem sobe e atualiza é o caderno-admin (`teste publicar`, `teste dados`, `teste parar`):
#   docker compose -p caderno-teste -f <este arquivo> --project-directory /home/leo/caderno-teste \
#     --env-file /home/leo/caderno-teste/.env.teste up -d --build
# Sem env_file de propósito: a API de teste não recebe as chaves VAPID da produção,
# então os avisos no celular ficam desligados e nada chega em dobro.
name: caderno-teste

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: manutencao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.teste}
      POSTGRES_DB: manutencao
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manutencao -d manutencao"]
      interval: 3s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://manutencao:${POSTGRES_PASSWORD}@db:5432/manutencao?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no .env.teste}
      COOKIE_SECURE: "true"
      PUBLIC_URL: https://${TESTE_DOMAIN:?Defina TESTE_DOMAIN no .env.teste}
      ATTACHMENT_DIR: /data/attachments
      PORT: "3000"
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    restart: unless-stopped
    networks:
      default:
      borda:
        # Nome pelo qual o Caddy da produção acha este web (deploy/vps/caddy/Caddyfile).
        aliases: [caderno-teste-web]
    depends_on:
      api:
        condition: service_healthy

networks:
  # Criada pelo docker-compose.vps.yml, que precisa estar no ar antes.
  borda:
    external: true
    name: caderno-borda

volumes:
  pgdata:
  attachments:
