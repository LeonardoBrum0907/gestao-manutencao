# Deploy automático da API na VPS quando a main muda em algo que a API usa.
# A tela não passa por aqui: a Vercel publica sozinha.
# Os testes rodam aqui; só depois o Coolify (coolify.leobrum.run) monta e publica a API.
# O Coolify troca o container só quando o HEALTHCHECK do apps/api/Dockerfile passa, e
# mantém a versão anterior no ar se o deploy falhar.
# Segredo COOLIFY_TOKEN: token da API do Coolify com as permissões read e deploy.
name: Deploy da API

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

# Um deploy por vez, sem cancelar o que já começou: cortar um build no meio deixa a API parada.
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

env:
  COOLIFY_URL: https://coolify.leobrum.run
  # Aplicação caderno-api no projeto caderno-gestor (production) do Coolify.
  COOLIFY_API_UUID: ndr8ptsky8jtzgaojusc9ns5
  API_URL: https://api.leobrum.run

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manutencao/api exec prisma generate
      - run: pnpm test
      - run: pnpm --filter @manutencao/api exec tsc -p tsconfig.json --noEmit

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Pedir o deploy ao Coolify
        id: pedido
        run: |
          resposta=$(curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_API_UUID")
          echo "$resposta"
          id=$(jq -r '.deployments[0].deployment_uuid // empty' <<<"$resposta")
          if [ -z "$id" ]; then
            echo "O Coolify não devolveu deployment_uuid (esperado: {\"deployments\":[{\"deployment_uuid\":…}]})." >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Esperar o Coolify terminar (até 25 min)
        env:
          DEPLOY_ID: ${{ steps.pedido.outputs.id }}
        run: |
          for _ in $(seq 1 150); do
            situacao=$(curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$DEPLOY_ID" | jq -r '.status')
            echo "$(date +%T) $situacao"
            case "$situacao" in
              finished) exit 0 ;;
              failed|cancelled-by-user|skipped)
                echo "Deploy $DEPLOY_ID terminou como '$situacao' (esperado: finished). Veja Deployment Logs no Coolify." >&2
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Deploy $DEPLOY_ID não terminou em 25 min." >&2
          exit 1
      - name: Conferir o /health pela internet
        run: curl -fsS --retry 5 --retry-delay 5 "$API_URL/health"
