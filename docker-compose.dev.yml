# Desenvolvimento com recarga ao salvar. Sobrepõe o docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# No Docker Desktop (Windows) o bind mount não repassa eventos de arquivo,
# então os dois watchers rodam por polling.
services:
  api:
    build:
      target: development
    environment:
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    volumes:
      - ./apps/api/src:/repo/apps/api/src

  web:
    build:
      target: development
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/index.html:/repo/apps/web/index.html
