services:
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: manutencao
      POSTGRES_PASSWORD: manutencao
      POSTGRES_DB: manutencao
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manutencao -d manutencao"]
      interval: 3s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${IMAGE_TARGET:-production}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env}
      SESSION_SECRET: ${SESSION_SECRET:-compose-session-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ATTACHMENT_DIR: /data/attachments
      PORT: "3000"
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
        required: false
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: ${IMAGE_TARGET:-production}
    environment:
      API_PROXY: http://api:3000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  attachments:
